kind = "web"
previewPath = "/"
title = "Royal Denture"
version = "1.0.0"
id = "artifacts/royal-denture"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19872

[services.development]
run = "pnpm --filter @workspace/royal-denture run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/royal-denture", "run", "build" ]
publicDir = "artifacts/royal-denture/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19872"
BASE_PATH = "/"
